<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b3c5d">
<title>香港國際機場航班 HKIA Flights</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Crect width=%2224%22 height=%2224%22 rx=%225%22 fill=%22%230b3c5d%22/%3E%3Cpath transform=%22rotate(45 12 12)%22 fill=%22%23fff%22 d=%22M12 2c.8 0 1.3.9 1.3 2v5.2l7.7 4.3v2l-7.7-2.3v4.6l2.2 1.6v1.6L12 20l-3.5 1v-1.6l2.2-1.6v-4.6L3 15.5v-2l7.7-4.3V4c0-1.1.5-2 1.3-2z%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/style.css?v=5">
</head>
<body>
<header class="top">
  <!-- decorative flight path + plane + clouds (self-drawn SVG, no logos) -->
  <svg class="sky" viewBox="0 0 400 150" preserveAspectRatio="xMaxYMin slice" aria-hidden="true" focusable="false">
    <defs><linearGradient id="trail" x1="0" x2="1"><stop offset="0" stop-color="#7dd3fc" stop-opacity="0"/><stop offset="1" stop-color="#7dd3fc" stop-opacity=".55"/></linearGradient></defs>
    <g fill="#fff" opacity=".07"><circle cx="300" cy="118" r="16"/><circle cx="320" cy="110" r="22"/><circle cx="344" cy="120" r="14"/><rect x="286" y="118" width="70" height="16" rx="8"/>
      <circle cx="120" cy="40" r="10"/><circle cx="134" cy="34" r="14"/><circle cx="150" cy="41" r="9"/><rect x="112" y="40" width="46" height="10" rx="5"/></g>
    <path d="M40 150 C 140 140, 230 110, 296 66" fill="none" stroke="url(#trail)" stroke-width="2" stroke-dasharray="6 7" opacity=".6" stroke-linecap="round"/>
  </svg>
  <div class="row">
    <h1><svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11.2" fill="#0f766e"/><path transform="rotate(45 12 12) translate(2.4 2.4) scale(.8)" fill="#fff" d="M12 2c.8 0 1.3.9 1.3 2v5.2l7.7 4.3v2l-7.7-2.3v4.6l2.2 1.6v1.6L12 20l-3.5 1v-1.6l2.2-1.6v-4.6L3 15.5v-2l7.7-4.3V4c0-1.1.5-2 1.3-2z"/></svg><span id="title">香港國際機場航班</span></h1>
    <select id="lang" aria-label="Language"></select>
  </div>
  <div class="row tools">
    <div class="tabs" role="tablist">
      <button id="tab-dep" role="tab" class="tab" data-tab="dep">離港</button>
      <button id="tab-arr" role="tab" class="tab" data-tab="arr">抵港</button>
    </div>
    <div class="font" role="group" id="fontgrp">
      <button id="fs-0" data-fs="0" aria-label="A-">A−</button><button id="fs-1" data-fs="1" aria-label="A">A</button><button id="fs-2" data-fs="2" aria-label="A+">A+</button>
    </div>
  </div>
  <div class="row filters">
    <input id="q" type="search" autocomplete="off" enterkeyhint="search">
    <select id="gate" aria-label="Gate"></select>
  </div>
  <div class="runway" aria-hidden="true">
    <svg class="rw-plane" viewBox="0 0 60 24"><path d="M0 22 C 16 21, 28 17, 38 11" fill="none" stroke="#7dd3fc" stroke-width="1.4" stroke-dasharray="3 3" opacity=".8"/>
      <g transform="translate(47 8) rotate(62) scale(.9) translate(-12 -12)" fill="#f0f9ff"><path d="M12 2c.8 0 1.3.9 1.3 2v5.2l7.7 4.3v2l-7.7-2.3v4.6l2.2 1.6v1.6L12 20l-3.5 1v-1.6l2.2-1.6v-4.6L3 15.5v-2l7.7-4.3V4c0-1.1.5-2 1.3-2z"/></g></svg>
  </div>
</header>
<div id="status" class="status">
  <div><span id="upd"></span> · <span id="cd"></span></div>
  <div id="src" class="small"></div>
  <div id="warn" class="warn" hidden></div>
  <button id="refresh" class="refresh">↻</button>
</div>
<main>
  <section id="detail" class="detail" hidden aria-live="polite">
    <button id="back" class="backbtn" type="button"></button>
    <div id="detailBody" class="board-wrap"></div>
  </section>
  <div id="listview">
    <section id="board" class="board-wrap" hidden aria-live="polite"></section>
    <div id="qhint" class="qhint" hidden></div>
    <div id="count" class="count"></div>
    <button id="earlier" class="linkbtn" hidden></button>
    <div id="list"></div>
    <button id="more" class="linkbtn" hidden></button>
  </div>
</main>
<footer id="foot"></footer>
<script src="assets/config.js?v=5"></script>
<script src="assets/i18n.js?v=5"></script>
<script src="assets/app.js?v=5"></script>
</body>
</html>
